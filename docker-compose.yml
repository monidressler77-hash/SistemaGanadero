version: '3.8'

services:
  web:
    build: .
    container_name: clase-web-php
    volumes:
      - ./www:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - db
    tty: true
    stdin_open: true
    restart: always

  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: clase-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mi_clase_db
    ports:
      - "3307:3306"
    restart: always

  # Interfaz Visual phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clase-phpmyadmin
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    restart: always